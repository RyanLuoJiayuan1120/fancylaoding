# 启用 / 总开关
enabled=true

# 是否把早期窗口交接给游戏（true = 单窗口无闪烁；false = 双窗口，Windows 建议）
adoptWindow=true

# 必须与游戏最终窗口尺寸一致，否则交接瞬间触发 resize
# （FancyMenu 在 Minecraft 构造期尚未初始化，resize 会直接 NPE）
windowWidth=854
windowHeight=480

# 视频：把帧序列放进这个目录，按文件名排序播放
framesDir=config/videoloading/frames
# 视频播完 / 没有视频时的静态背景
background=config/videoloading/background.png
# 可选：直接播放 MP4；桌面首次使用自动下载 FFmpeg
# Android/FCL 不执行 FFmpeg，直接用纯 Java JCodec；
# 同目录的 video-mobile.mp4（960x540/15fps）会被优先用于 JCodec
videoPath=config/videoloading/video.mp4
videoWidth=960
videoHeight=540
videoFps=15
# 字体（外部，不进 jar）
fontPath=config/worldloading/fonts/LXGWWenKaiLite-Regular.ttf
fps=15

# “等视频播完”的持有上限（毫秒）。超时后强制交接，绝不让启动被视频拖长
maxHoldMs=3000

# 首次启动进度分配：mixin 0~80%，资源加载 80~100%
mixinShare=0.8

# 进度条（ARGB）
barColor=FFFFFFFF
barBgColor=AA000000
barWidth=1.0
barHeight=6
barY=0.84
